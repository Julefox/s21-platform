# =============================================================================
# S21 SDK Detour Registry Configuration
# =============================================================================
# This file lets you selectively disable IDetour classes that crash the game
# or have broken S21 patterns. The framework (Systems_Init_S21) will still
# attempt to SEH-catch per-class failures, but if a class causes a RUNTIME
# crash (not an init-time crash), you need to disable it here.
#
# Format:
#   <ClassName> <state>
#
# State values:
#   enabled  - attempt scan + hook (default if omitted)
#   disabled - skip entirely (framework won't touch it)
#   skip     - alias for disabled
#
# Lines starting with # are comments, blank lines are ignored.
#
# Tiers:
#   Tier 0 — Core infrastructure (safe, very low risk)
#   Tier 1 — VPC / App systems (usually safe)
#   Tier 2 — Engine core (moderate risk — watch for CHost* crashes)
#   Tier 3 — Network (required for connection, moderate risk)
#   Tier 4 — Squirrel / Script (moderate risk — compiler patches apply here)
#   Tier 5 — Game / Shared (higher risk — dt_injection overlaps)
#   Tier 6 — Rendering (ImGui etc. — currently working via manual init)
#
#
# =============================================================================
# Tier 0 — Core infrastructure (tier0 / tier1)
# =============================================================================
VPlatform           enabled
VJobThread          enabled
VThreadTools        enabled
VTSListBase         enabled
VCommandLine        enabled
VCVar               enabled

# =============================================================================
# Tier 1 — VPC / App systems / FileSystem
# =============================================================================
VAppSystem          enabled
VKeyValues          enabled
VRSON               enabled
VFactory            enabled
VCallback           enabled
VCompletion         enabled
HKeyValuesSystem    enabled
VBaseFileSystem     enabled
VFileSystem_Stdio   enabled
VMDLCache           enabled

# =============================================================================
# Tier 2 — Engine core
# =============================================================================
VCommon             enabled
VSys_Dll            enabled
VSys_Dll2           enabled
VSys_Utils          enabled
VEngine             enabled
VHost               enabled
VHostCmd            enabled
VHostState          enabled
VCmd                enabled

# =============================================================================
# Tier 3 — Network
# =============================================================================
VOpcodes            enabled
V_NetMessages       enabled
VNet                enabled
VNetChan            enabled

# =============================================================================
# Tier 4 — Launcher / App bootstrap
# =============================================================================
VPRX                enabled
VLauncher           enabled
VAppSystemGroup     enabled

# =============================================================================
# Tier 5 — Platform integration (Ebisu SDK)
# =============================================================================
# Ebisu is critical for Steam/Origin auth. Patterns may differ between S3 and S21.
VEbisuSDK           enabled

# =============================================================================
# Tier 6 — Script (Squirrel VM)
# =============================================================================
# Squirrel 2.2.3 is mostly unchanged between S3 and S21.
VSquirrel           enabled
VScript             enabled
VSquirrelAPI        enabled
VSquirrelStdAux     enabled
VSquirrelVM         enabled

# =============================================================================
# Tier 7 — Game shared
# =============================================================================
VUserCmd            enabled
V_UTIL_Shared       enabled
VEdict              enabled

# =============================================================================
# Tier 8 — Rendering / ImGui (DEDICATED=0 only)
# =============================================================================
# These are currently working via the manual init in dllmain.cpp.
# The framework will re-attempt them. If they double-hook or crash,
# disable them here and rely on the manual init.
VDXGI               enabled
VGame               enabled

# =============================================================================
# Tier 9 — Bridge (S3->S21 bridge-specific hooks)
# =============================================================================
VBridgeFlagSet      enabled

# Weapon const-types repopulate + integrity neuter (must not stay quarantined)
VIntegrityNeuterS21  enabled

