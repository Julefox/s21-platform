// ============================================================================
//  SERVER / DEDI autoexec (r5apex_ds + server.dll). Exec'd after
//  system/autoexec.cfg by CHostState::LoadConfig when !CLIENT_DLL.
// ============================================================================

hostname                     "R5F Server"  // Name shown in the server browser. The master server rejects an empty one.
exec user/fs_stats
spire_host_visibility        "2"      // 0 = offline, 1 = hidden (token only), 2 = public.
spire_matchmaking_enabled    "1"      // Launching with -offline turns this off in offline_server.cfg.
script_show_output           "0"      // printt to the Windows console hitches sim.
script_show_warning          "0"
